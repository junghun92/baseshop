name: Deploy baseshop-spring

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/junghun92/baseshop-spring

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 0. 설정 Secret 확인
        env:
          PROPS: ${{ secrets.APPLICATION_PROD_PROPERTIES }}
        run: |
          if [ -z "$PROPS" ]; then
            echo "APPLICATION_PROPERTIES Secret이 비어있습니다."
            exit 1
          fi

      - name: 1. 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. 이미지 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: 4. 서버 배포
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/baseshop/baseshop-deploy
            
            # properties 파일을 Secret 내용으로 덮어쓰기
            # 운영 설정 파일 생성 (★ 파일명 application-prod.properties)
            cat > app-config/application-prod.properties << 'EOF'
            ${{ secrets.APPLICATION_PROD_PROPERTIES }}
            EOF
            chmod 600 app-config/application-prod.properties

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull baseshop-spring
            docker compose up -d --force-recreate baseshop-spring
            docker image prune -f
spring.application.name=baseshop

#database
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=DB_URL
spring.datasource.username=DB_USERNAME
spring.datasource.password=DB_PASSWORD

#DB \uCEE4\uB125\uC158 \uD480 \uC124\uC815
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout= 3000

# DDL generation (none, validate, update, create, create-drop)
spring.jpa.hibernate.ddl-auto=none

# SQL SHOW
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# \uB85C\uADF8 \uC124\uC815
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# MariaDB (DB \uCFFC\uB9AC \uBC29\uC5B8\uC124\uC815)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# JSON \uC124\uC815
spring.jackson.date-format= yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone= Asia/Seoul

# JWT \uC124\uC815
jwt.secret=32\uC790_\uC774\uC0C1\uC758_\uC784\uC758_\uBB38\uC790\uC5F4
# 30\uBD84
jwt.access-token-expire-time=1800000
# 7\uC77C
jwt.refresh-token-expire-time=604800000
jwt.access-token-name=ACCESS
jwt.refresh-token-name=REFRESH


spring.jpa.properties.hibernate.default_batch_fetch_size=100